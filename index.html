<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ฟังแล้วตอบ — เตรียมสอบสาธิตจุฬาฯ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FB; --navy:#1B3A4B; --gold:#FFC857; --coral:#FF6B6B; --mint:#06D6A0; --card:#FFFFFF;
    --line:#D8E8EE; --purple:#7C6FE0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--sky); color:var(--navy);
    font-family:'Sarabun',sans-serif; -webkit-tap-highlight-color: transparent;
    background-image: radial-gradient(circle at 10% 10%, rgba(255,200,87,0.18) 0, transparent 40%),
                       radial-gradient(circle at 90% 85%, rgba(6,214,160,0.15) 0, transparent 40%);
  }
  .wrap{max-width:560px; margin:0 auto; padding:18px 16px 60px;}
  header{text-align:center; margin-bottom:10px;}
  h1{font-family:'Mitr',sans-serif; font-size:1.5rem; font-weight:700; margin:6px 0 2px;}
  .subtitle{font-size:.85rem; color:#4d6a78; margin:0;}

  .levelPanel{margin:14px 0 8px;}
  .levelLabel{font-size:.8rem; color:#4d6a78; margin-bottom:6px; text-align:center;}
  .levelRow{display:flex; gap:6px; justify-content:center;}
  .levelBtn{
    width:42px; height:42px; border-radius:50%; border:2px solid var(--line); background:#fff;
    font-family:'Mitr',sans-serif; font-weight:700; font-size:1rem; color:var(--navy); cursor:pointer;
  }
  .levelBtn.active{background:var(--purple); border-color:var(--purple); color:#fff;}
  .levelHint{display:flex; justify-content:space-between; font-size:.7rem; color:#90a5af; max-width:230px; margin:4px auto 0;}

  .catGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .catBtn{
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px; border-radius:14px;
    border:2px solid var(--line); background:#fff; font-family:'Sarabun',sans-serif; font-size:.72rem;
    color:var(--navy); cursor:pointer; line-height:1.2;
  }
  .catBtn .emo{font-size:1.3rem;}
  .catBtn.active{background:#EFEBFF; border-color:var(--purple); font-weight:600;}

  .progress{font-size:.85rem; color:#4d6a78; text-align:center; margin-bottom:6px;}
  .progressBar{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px;}
  .progressFill{height:100%; background:var(--gold); border-radius:99px; transition:width .25s;}

  .card{
    background:var(--card); border-radius:24px; padding:22px 18px; box-shadow:0 6px 24px rgba(27,58,75,0.08);
    border:1px solid var(--line);
  }
  .tagsRow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .secLabel{
    font-family:'Mitr',sans-serif; font-size:.74rem; font-weight:600; color:#0E7C66; background:#E3FBF3;
    display:inline-block; padding:4px 10px; border-radius:999px;
  }
  .lvlTag{
    font-family:'Mitr',sans-serif; font-size:.74rem; font-weight:600; color:#5b4bbf; background:#EFEBFF;
    display:inline-block; padding:4px 10px; border-radius:999px;
  }

  .playZone{display:flex; flex-direction:column; align-items:center; padding:14px 0 8px;}
  .playBtn{
    position:relative; width:100px; height:100px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(160deg, var(--gold), #ffb13d);
    box-shadow:0 4px 0 #c98a1a, 0 8px 16px rgba(255,176,61,0.35);
    display:flex; align-items:center; justify-content:center; font-size:2.3rem; color:var(--navy);
    transition:all .12s ease; top:0; position:relative;
  }
  .playBtn:hover{top:-2px; box-shadow:0 6px 0 #c98a1a, 0 12px 20px rgba(255,176,61,0.4);}
  .playBtn:active{top:4px; box-shadow:0 0px 0 #c98a1a, 0 4px 10px rgba(255,176,61,0.2);}
  .playBtn.loading{
    background:linear-gradient(160deg,#d4e8ff,#93c5fd);
    box-shadow:0 4px 0 #3b82f6, 0 8px 16px rgba(59,130,246,0.3);
    animation:pulse-load 1s ease infinite;
  }
  @keyframes pulse-load{
    0%,100%{box-shadow:0 4px 0 #3b82f6, 0 0 0 0 rgba(59,130,246,0.25);}
    50%{box-shadow:0 4px 0 #3b82f6, 0 0 0 10px rgba(59,130,246,0);}
  }
  .playBtn.speaking{
    background:linear-gradient(160deg,#6ee7b7,#34d399);
    box-shadow:0 4px 0 #059669, 0 8px 16px rgba(16,185,129,0.35);
  }
  .statusBadge{
    font-size:.72rem; font-weight:600; padding:3px 10px; border-radius:99px;
    background:var(--sky); color:#4d6a78; border:1px solid var(--line);
    transition:all .2s;
  }
  .statusBadge.loading{background:#EFF6FF; color:#1d4ed8; border-color:#93c5fd;}
  .statusBadge.playing{background:#E3FBF3; color:#065f46; border-color:var(--mint);}
  .ring{display:none;}
  .playHint{font-size:.82rem; color:#4d6a78; margin-top:8px;}
  .toggleText{margin-top:6px; background:none; border:none; color:#2E75B6; font-size:.8rem; text-decoration:underline; cursor:pointer; font-family:'Sarabun',sans-serif;}
  .revealText{margin-top:10px; padding:12px 14px; background:#F5F8FA; border-radius:14px; font-size:.86rem; color:#34505c; line-height:1.6; display:none;}
  .revealText.show{display:block;}

  .qText{font-family:'Mitr',sans-serif; font-weight:600; font-size:1.02rem; text-align:center; margin:14px 0 16px;}

  .choices{display:flex; flex-direction:column; gap:10px;}
  .choiceRow{display:flex; align-items:center; gap:8px;}
  .choiceBtn{
    flex:1; display:flex; align-items:center; gap:10px; text-align:left; padding:13px 14px; border-radius:16px;
    border:2px solid var(--line); background:#fff; font-family:'Sarabun',sans-serif; font-size:.98rem; color:var(--navy);
    cursor:pointer; transition:all .12s ease;
    box-shadow:0 4px 0 var(--line);
    position:relative; top:0;
  }
  .choiceBtn:hover:not(:disabled){
    background:#F8FBFC; border-color:#b0ccd8;
    box-shadow:0 5px 0 #b0ccd8; top:-1px;
  }
  .choiceBtn:active:not(:disabled){
    box-shadow:0 0px 0 var(--line); top:4px;
    background:#EEF5F8;
  }
  .choiceLabel{
    flex:0 0 28px; height:28px; border-radius:50%; background:var(--sky);
    display:flex; align-items:center; justify-content:center;
    font-family:'Mitr',sans-serif; font-weight:600; font-size:.86rem;
    border:1.5px solid var(--line); transition:all .12s;
  }
  .choiceSpeak{
    flex:0 0 40px; height:40px; border-radius:50%; border:1.5px solid var(--line);
    background:#fff; font-size:1rem; cursor:pointer; color:var(--purple);
    transition:all .12s ease; position:relative; top:0;
    box-shadow:0 2px 0 var(--line); display:flex; align-items:center; justify-content:center;
  }
  .choiceSpeak:hover{background:var(--sky); box-shadow:0 3px 0 #b0ccd8; top:-1px;}
  .choiceSpeak:active{box-shadow:0 0px 0 var(--line); top:2px;}
  .choiceSpeak.playing{
    border-color:var(--purple); background:#EFEBFF; color:var(--purple);
    box-shadow:0 2px 0 var(--purple);
    animation:pulse-speak .9s ease infinite;
  }
  @keyframes pulse-speak{
    0%,100%{box-shadow:0 2px 0 var(--purple), 0 0 0 0 rgba(124,111,224,0.2);}
    50%{box-shadow:0 2px 0 var(--purple), 0 0 0 6px rgba(124,111,224,0);}
  }
  .choiceBtn.correct{background:#E3FBF3; border-color:var(--mint); box-shadow:0 4px 0 #04a87e; color:#064e3b;}
  .choiceBtn.correct .choiceLabel{background:var(--mint); color:#fff; border-color:var(--mint);}
  .choiceBtn.correct::after{content:'✓'; position:absolute; right:14px; font-size:1.1rem; font-weight:700; color:var(--mint);}
  .choiceBtn.wrong{background:#FFEDED; border-color:var(--coral); box-shadow:0 4px 0 #cc4444; color:#7f1d1d;}
  .choiceBtn.wrong .choiceLabel{background:var(--coral); color:#fff; border-color:var(--coral);}
  .choiceBtn.wrong::after{content:'✗'; position:absolute; right:14px; font-size:1.1rem; font-weight:700; color:var(--coral);}
  .choiceBtn:disabled{cursor:default;}

  .navRow{display:flex; gap:10px; margin-top:18px;}
  .navBtn{
    flex:1; padding:13px; border-radius:16px; border:none;
    font-family:'Mitr',sans-serif; font-weight:600; font-size:.95rem; cursor:pointer;
    background:var(--navy); color:#fff;
    box-shadow:0 4px 0 #0d1f28;
    position:relative; top:0; transition:all .12s ease;
  }
  .navBtn:hover:not(:disabled){top:-1px; box-shadow:0 5px 0 #0d1f28;}
  .navBtn:active:not(:disabled){top:4px; box-shadow:0 0px 0 #0d1f28;}
  .navBtn.secondary{
    background:#fff; color:var(--navy); border:2px solid var(--navy);
    box-shadow:0 4px 0 #1B3A4B;
  }
  .navBtn.secondary:hover:not(:disabled){box-shadow:0 5px 0 #1B3A4B; top:-1px;}
  .navBtn.secondary:active:not(:disabled){box-shadow:0 0px 0 #1B3A4B; top:4px;}
  .navBtn:disabled{opacity:.4; cursor:default; box-shadow:none;}

  .controls{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:16px 0 6px; font-size:.8rem; color:#4d6a78;}
  .controls label{display:flex; align-items:center; gap:6px;}
  input[type=range]{width:100px;}

  .scoreBar{display:flex; justify-content:space-between; align-items:center; background:var(--card); border-radius:16px; padding:10px 16px; margin-top:14px; font-size:.84rem; border:1px solid var(--line);}
  .scoreBar b{font-family:'Mitr',sans-serif;}
  .resetBtn{background:none; border:none; color:#FF6B6B; font-size:.8rem; cursor:pointer; text-decoration:underline;}
  #rateVal{font-size:.8rem; color:var(--purple); font-weight:600; min-width:36px;}
  .warn{background:#FFF6E0; border:1px solid #FFD976; border-radius:14px; padding:10px 14px; font-size:.8rem; color:#7a5a00; margin-bottom:14px; display:none;}
  .empty{text-align:center; padding:30px 10px; color:#4d6a78; font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎧 ฟังแล้วตอบ</h1>
    <p class="subtitle">แบบฝึกทักษะการฟัง — เตรียมสอบเข้าสาธิตจุฬาฯ <span style="font-size:.7rem;background:#EFEBFF;color:#5b4bbf;padding:2px 8px;border-radius:99px;margin-left:4px;">v2.2</span></p>
  </header>

  <div id="ttsWarn" class="warn">อุปกรณ์นี้อาจไม่รองรับเสียงพูดภาษาไทย ลองใช้เบราว์เซอร์อื่น หรือกด "แสดงข้อความ" เพื่ออ่านเอง</div>

  <div class="levelPanel">
    <div class="levelLabel">เลือกระดับความยาก (1 ง่ายสุด — 5 ยากที่สุด)</div>
    <div class="levelRow" id="levelRow"></div>
    <div class="levelHint"><span>ง่าย</span><span>ยาก</span></div>
  </div>

  <div class="catGrid" id="catGrid"></div>

  <div class="progress" id="progressLabel"></div>
  <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>

  <div class="card" id="card">
    <div class="tagsRow">
      <span class="secLabel" id="secLabel"></span>
      <span class="lvlTag" id="lvlTag"></span>
    </div>

    <div class="playZone">
      <button class="playBtn" id="playBtn">
        <span id="playIcon">🔊</span>
      </button>
      <div class="playHint">กดฟังคำถามนี้</div>
      <span class="statusBadge" id="statusBadge">พร้อม</span>
      <button class="toggleText" id="toggleText">👁 แสดงข้อความ (สำหรับผู้ปกครอง)</button>
      <div class="revealText" id="revealText"></div>
    </div>

    <div class="qText" id="qText"></div>
    <div class="choices" id="choices"></div>

    <div class="navRow">
      <button class="navBtn secondary" id="prevBtn">← ก่อนหน้า</button>
      <button class="navBtn" id="nextBtn">ถัดไป →</button>
    </div>
  </div>

  <div class="controls">
    <label><input type="checkbox" id="autoPlay" checked> เล่นเสียงอัตโนมัติ</label>
    <label>ความเร็ว <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85"> <span id="rateVal">0.85x</span></label>
  </div>

  <div class="scoreBar">
    <span>ตอบถูก <b id="scoreCorrect">0</b> / <b id="scoreTotal">0</b> ข้อที่ทำแล้ว</span>
    <button class="resetBtn" id="resetBtn">รีเซ็ตคะแนน</button>
  </div>
</div>

let level = 1;
let catKey = 'all';
let pos = 0;
let answered = {};
let score = {};
for (let l=1; l<=5; l++) score[l] = {correct:0, total:0};

const els = {
  levelRow: document.getElementById('levelRow'),
  catGrid: document.getElementById('catGrid'),
  progressLabel: document.getElementById('progressLabel'),
  progressFill: document.getElementById('progressFill'),
  card: document.getElementById('card'),
  secLabel: document.getElementById('secLabel'),
  lvlTag: document.getElementById('lvlTag'),
  playBtn: document.getElementById('playBtn'),
  playIcon: document.getElementById('playIcon'),
  toggleText: document.getElementById('toggleText'),
  revealText: document.getElementById('revealText'),
  qText: document.getElementById('qText'),
  choices: document.getElementById('choices'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  autoPlay: document.getElementById('autoPlay'),
  rate: document.getElementById('rate'),
  scoreCorrect: document.getElementById('scoreCorrect'),
  scoreTotal: document.getElementById('scoreTotal'),

function buildLevelButtons(){
  els.levelRow.innerHTML = '';
  for (let l=1; l<=5; l++){
    const b = document.createElement('button');
    b.className = 'levelBtn' + (l===level ? ' active' : '');
    b.textContent = l;
    b.onclick = () => { level = l; pos = 0; render(); buildLevelButtons(); };
    els.levelRow.appendChild(b);
  }
}

function buildCatGrid(){
  els.catGrid.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'catBtn' + (catKey==='all' ? ' active' : '');
  allBtn.innerHTML = '<span class="emo">🧩</span><span>ทุกหมวด</span>';
  allBtn.onclick = () => { catKey='all'; pos=0; render(); buildCatGrid(); };
  els.catGrid.appendChild(allBtn);
  DATA.categories.forEach(c => {
    const b = document.createElement('button');
    b.className = 'catBtn' + (catKey===c.key ? ' active' : '');
    b.innerHTML = '<span class="emo">'+c.emoji+'</span><span>'+c.label+'</span>';
    b.onclick = () => { catKey=c.key; pos=0; render(); buildCatGrid(); };
    els.catGrid.appendChild(b);
  });
}

function filteredQuestions(){
  return DATA.questions.filter(q => q.level === level && (catKey==='all' || q.catKey === catKey));
}

function answerKey(q, idx){ return level+'-'+catKey+'-'+idx; }

function render(){
  const list = filteredQuestions();
  if (list.length === 0){
    els.card.innerHTML = '<div class="empty">ไม่พบคำถามในหมวดนี้</div>';
    els.progressLabel.textContent = '';
    els.progressFill.style.width = '0%';
    return;
  }
  if (pos >= list.length) pos = 0;
  const q = list[pos];
  const key = level+'-'+catKey+'-'+pos;

  els.progressLabel.textContent = 'ข้อที่ ' + (pos+1) + ' จาก ' + list.length;
  els.progressFill.style.width = ((pos+1)/list.length*100) + '%';

  els.secLabel.textContent = q.emoji + ' ' + q.catLabel;
  els.lvlTag.textContent = 'ระดับ ' + q.level;

  els.revealText.classList.remove('show');
  els.revealText.innerHTML = '<b>ข้อความ:</b> ' + q.read + '<br><br><b>คำถาม:</b> ' + q.question;
  els.toggleText.textContent = '👁 แสดงข้อความ (สำหรับผู้ปกครอง)';

  els.qText.textContent = 'คำถาม: ' + q.question;

  els.choices.innerHTML = '';
  const labels = ['ก','ข','ค','ง'];
  const prevAnswer = answered[key];
  q.choices.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'choiceRow';

    const speakBtn = document.createElement('button');
    speakBtn.className = 'choiceSpeak';
    speakBtn.innerHTML = '🔈';
    speakBtn.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll('.choiceSpeak').forEach(b => b.classList.remove('playing'));
      speakBtn.classList.add('playing');
      speakText(c).finally(() => speakBtn.classList.remove('playing'));
    };

    const btn = document.createElement('button');
    btn.className = 'choiceBtn';
    btn.innerHTML = '<span class="choiceLabel">'+labels[i]+'</span><span>'+c+'</span>';
    btn.onclick = () => selectChoice(q, key, i);
    if (prevAnswer !== undefined) {
      btn.disabled = true;
      if (i === q.answer) btn.classList.add('correct');
      else if (i === prevAnswer) btn.classList.add('wrong');
    }
    row.appendChild(speakBtn);
    row.appendChild(btn);
    els.choices.appendChild(row);
  });

  els.prevBtn.disabled = pos === 0;
  els.nextBtn.textContent = (pos === list.length-1) ? 'จบแล้ว ✓' : 'ถัดไป →';

  updateScore();
  if (els.autoPlay.checked) speakCurrent(q);
}

function selectChoice(q, key, i){
  if (answered[key] !== undefined) return;
  answered[key] = i;
  score[level].total++;
  const correct = (i === q.answer);
  if (correct) score[level].correct++;
  render();
  setTimeout(() => {
    const ans = q.choices[q.answer];
    if (correct) {
      speakSSML('<speak>ถูกต้อง<break time="150ms"/>คำตอบคือ ' + ans + '</speak>');
    } else {
      speakSSML('<speak>ยังไม่ถูก<break time="150ms"/>คำตอบที่ถูกคือ<break time="100ms"/>' + ans + '</speak>');
    }
  }, 350);
}

function updateScore(){
  els.scoreCorrect.textContent = score[level].correct;
  els.scoreTotal.textContent = score[level].total;
}

const GCP_KEY = "AIzaSyC7CQLZoJup7fAisfmO1r2KFH8K50A9SoE";
let speaking = false;
let currentAudio = null;
let currentAbort = null;
let requestToken = 0;

function stopSpeaking(){
  if (currentAbort){ currentAbort.abort(); currentAbort = null; }
  if (currentAudio){ currentAudio.pause(); currentAudio.src = ''; currentAudio = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  speaking = false;
  els.playBtn.classList.remove('speaking','loading');
  els.playIcon.textContent = '🔊';
  if (els.statusBadge){ els.statusBadge.className='statusBadge'; els.statusBadge.textContent='พร้อม'; }
}

async function speakText(text){
  stopSpeaking();
  const rate = parseFloat(els.rate.value);
  const myToken = ++requestToken;
  const abortCtrl = new AbortController();
  currentAbort = abortCtrl;
  if (els.statusBadge){ els.statusBadge.className='statusBadge loading'; els.statusBadge.textContent='กำลังโหลด...'; }
  els.playBtn.classList.add('loading'); els.playIcon.textContent='⏳';
  try {
    const resp = await fetch(
      `https://texttospeech.googleapis.com/v1beta1/text:synthesize?key=${GCP_KEY}`,
      { method:'POST', headers:{'Content-Type':'application/json'},
        signal: abortCtrl.signal,
        body: JSON.stringify({
          input: { text },
          voice: { languageCode:'th-TH', name:'th-TH-Chirp3-HD-Achernar' },
          audioConfig: {
            audioEncoding: 'LINEAR16',
            sampleRateHertz: 24000,
            speakingRate: rate
          }
        })
      }
    );
    const data = await resp.json();
    if (myToken !== requestToken) return;
    if (!data.audioContent) throw new Error((data.error && data.error.message) || 'No audio');
    const audio = new Audio('data:audio/wav;base64,' + data.audioContent);
    currentAudio = audio;
    speaking = true;
    els.playBtn.classList.remove('loading'); els.playBtn.classList.add('speaking');
    els.playIcon.textContent = '⏸';
    if (els.statusBadge){ els.statusBadge.className='statusBadge playing'; els.statusBadge.textContent='กำลังเล่น'; }
    audio.onended = () => { if (myToken === requestToken) stopSpeaking(); };
    audio.onerror = () => { if (myToken === requestToken) stopSpeaking(); };
    audio.play();
  } catch(err) {
    if (err.name === 'AbortError') return;
    if (myToken !== requestToken) return;
    console.error('TTS error:', err);
    els.playBtn.classList.remove('loading'); els.playIcon.textContent='🔊';
    if (els.statusBadge){ els.statusBadge.className='statusBadge'; els.statusBadge.textContent='พร้อม'; }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = rate;
    u.onstart = () => { if(myToken===requestToken){ speaking=true; els.playBtn.classList.add('speaking'); els.playIcon.textContent='⏸'; if(els.statusBadge){els.statusBadge.className='statusBadge playing';els.statusBadge.textContent='กำลังเล่น';}}};
    u.onend = () => { if(myToken===requestToken) stopSpeaking(); };
    window.speechSynthesis.speak(u);
  }
}
function buildSSML(read, question){
  let readSSML = read.replace(/(\d+)\s*-\s*(?=\d)/g, '$1<break time="100ms"/>');
  readSSML = readSSML.replace(/:/g, '<break time="100ms"/>');
  return `<speak>
    ${readSSML}
    <break time="500ms"/>
    คำถาม <break time="150ms"/> ${question}
  </speak>`;
}

async function speakSSML(ssml){
  stopSpeaking();
  const rate = parseFloat(els.rate.value);
  const myToken = ++requestToken;
  const abortCtrl = new AbortController();
  currentAbort = abortCtrl;
  try {
    const url = 'https://texttospeech.googleapis.com/v1beta1/text:synthesize?key=' + GCP_KEY;
    const resp = await fetch(url,
      { method:'POST', headers:{'Content-Type':'application/json'},
        signal: abortCtrl.signal,
        body: JSON.stringify({
          input: { ssml },
          voice: { languageCode:'th-TH', name:'th-TH-Chirp3-HD-Achernar' },
          audioConfig: { audioEncoding:'LINEAR16', sampleRateHertz:24000, speakingRate: rate }
        })
      }
    );
    const data = await resp.json();
    if (myToken !== requestToken) return;
    if (!data.audioContent) throw new Error((data.error && data.error.message) || 'No audio');
    const audio = new Audio('data:audio/wav;base64,' + data.audioContent);
    currentAudio = audio;
    speaking = true;
    els.playBtn.classList.add('speaking');
    els.playIcon.textContent = '⏸';
    audio.onended = () => { if (myToken === requestToken) stopSpeaking(); };
    audio.onerror = () => { if (myToken === requestToken) stopSpeaking(); };
    audio.play();
  } catch(err) {
    if (err.name === 'AbortError') return;
    if (myToken !== requestToken) return;
    console.error('SSML TTS error:', err);
    const u = new SpeechSynthesisUtterance(ssml.replace(/<[^>]+>/g,''));
    u.lang = 'th-TH'; u.rate = rate;
    u.onstart = () => { if(myToken===requestToken){ speaking=true; els.playBtn.classList.add('speaking'); els.playIcon.textContent='⏸'; }};
    u.onend = () => { if(myToken===requestToken) stopSpeaking(); };
    window.speechSynthesis.speak(u);
  }
}

function speakCurrent(q){
  speakSSML(buildSSML(q.read, q.question));
}
els.playBtn.onclick = () => {
  const list = filteredQuestions();
  if (list.length===0) return;
  if (speaking) { stopSpeaking(); return; }
  else speakCurrent(list[pos]);
};

els.toggleText.onclick = () => {
  const showing = els.revealText.classList.toggle('show');
  els.toggleText.textContent = showing ? '🙈 ซ่อนข้อความ' : '👁 แสดงข้อความ (สำหรับผู้ปกครอง)';
};

els.prevBtn.onclick = () => { if (pos>0){ pos--; render(); } };
els.nextBtn.onclick = () => { const list=filteredQuestions(); if (pos<list.length-1){ pos++; render(); } };

els.resetBtn.onclick = () => {
  score[level] = {correct:0, total:0};
  Object.keys(answered).forEach(k => { if (k.startsWith(level+'-')) delete answered[k]; });
  render();
};

if (!('speechSynthesis' in window)) { els.ttsWarn.style.display = 'block'; }
else { window.speechSynthesis.onvoiceschanged = () => {}; }
document.getElementById('rate').addEventListener('input', function(){
  document.getElementById('rateVal').textContent = parseFloat(this.value).toFixed(2) + 'x';
});

buildLevelButtons();
buildCatGrid();
render();
</script>
